name: chessmate
description: A polished Flutter chess app with legal move validation and a Stockfish-powered master-strength AI.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  chess: ^0.8.1
  google_mobile_ads: ^9.1.0
  web_socket_channel: ^3.0.3
  stockfish: ^1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
