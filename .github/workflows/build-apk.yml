name: Build ChessMate APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ChessMate
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.3
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.3'
          cache: true

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14'

      - name: Create Android local.properties
        run: echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

      - name: Generate Gradle wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.14 --distribution-type bin

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run analyzer
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChessMate-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ChessMate v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
