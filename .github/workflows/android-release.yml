name: Build ChessMate Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - name: Generate Android wrapper/project files
        shell: bash
        run: |
          mkdir -p /tmp/chessmate
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/chessmate/AndroidManifest.xml
          fi
          flutter create --platforms=android .
          mkdir -p android/app/src/main/kotlin/com/chessmate/app
          cat > android/app/src/main/kotlin/com/chessmate/app/MainActivity.kt <<'EOF'
          package com.chessmate.app

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity : FlutterActivity()
          EOF
          rm -rf android/app/src/main/kotlin/com/example
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/settings.gradle")
          s = p.read_text()
          s = s.replace('id "com.android.application" version "8.7.3" apply false',
                        'id "com.android.application" version "8.11.1" apply false')
          p.write_text(s)

          p = Path("android/gradle/wrapper/gradle-wrapper.properties")
          s = p.read_text()
          import re
          s = re.sub(r'gradle-[0-9.]+-all\.zip', 'gradle-8.14-all.zip', s)
          p.write_text(s)

          p = Path("android/app/build.gradle")
          s = p.read_text()
          s = s.replace('namespace = "com.example.chessmate"', 'namespace = "com.chessmate.app"')
          s = s.replace('applicationId = "com.example.chessmate"', 'applicationId = "com.chessmate.app"')
          s = s.replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
          s = s.replace('sourceCompatibility = JavaVersion.VERSION_11', 'sourceCompatibility = JavaVersion.VERSION_17')
          s = s.replace('targetCompatibility = JavaVersion.VERSION_11', 'targetCompatibility = JavaVersion.VERSION_17')
          s = s.replace('jvmTarget = JavaVersion.VERSION_11', 'jvmTarget = JavaVersion.VERSION_17')
          p.write_text(s)

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace('android:label="chessmate"', 'android:label="ChessMate"')
          marker = '    </application>'
          meta = '''        <meta-data
              android:name="com.google.android.gms.ads.APPLICATION_ID"
              android:value="ca-app-pub-4813245225944962~1451689138" />
          '''
          if 'com.google.android.gms.ads.APPLICATION_ID' not in s:
              s = s.replace(marker, meta + marker)
          p.write_text(s)
          PY

      - name: Verify
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChessMate-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
